# Build firmware tren GitHub (khong can cai ESP-IDF tren may):
# moi lan day code len main -> build, gop thanh 1 file evcarhud-full.bin (nap o dia chi 0x0)
# va dat vao ban phat hanh "gofa-thu" de tai ve, roi tai len evcarhud.com/admin.
name: Build thu GOFA (nhanh claude)

on:
  push:
    branches: [claude/project-thread-jdaxsn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # de phien ban trong file .bin la ma commit (git describe)

      - name: Bo the gofa-thu (khong de git describe ghi ten the vao phien ban)
        run: git tag -d gofa-thu || true

      - name: Build bang ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32
          command: git config --global --add safe.directory /app/${{ github.repository }} && idf.py build && idf.py merge-bin -o evcarhud-full.bin

      - name: Dat ten file theo commit
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp build/evcarhud-full.bin "evcarhud-2.8-$SHORT.bin"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          ls -la build/evcarhud-full.bin

      - uses: actions/upload-artifact@v4
        with:
          name: evcarhud-2.8-${{ env.SHORT }}
          path: evcarhud-2.8-${{ env.SHORT }}.bin

      - name: Cap nhat ban phat hanh "gofa-thu"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gofa-thu --yes --cleanup-tag || true
          gh release create gofa-thu "evcarhud-2.8-$SHORT.bin" --target "$GITHUB_SHA" \
            --title "Thử GOFA 2.8 ($SHORT)" \
            --notes "Bản thử GOFA cho 2.8\" (commit $SHORT), chưa phải bản phát hành. Tải file .bin rồi đưa lên evcarhud.com/admin, địa chỉ nạp 0x0." --prerelease
